name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@v4

      - name: Give the release a forge name
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          elements=(
            Hydrogen Helium Lithium Beryllium Boron Carbon Nitrogen Oxygen Fluorine Neon
            Sodium Magnesium Aluminium Silicon Phosphorus Sulfur Chlorine Argon Potassium Calcium
            Scandium Titanium Vanadium Chromium Manganese Iron Cobalt Nickel Copper Zinc
            Gallium Germanium Arsenic Selenium Bromine Krypton Rubidium Strontium Zirconium Niobium
            Molybdenum Ruthenium Rhodium Palladium Silver Cadmium Indium
          )
          tools=(
            Anvil Hammer Tongs Bellows Chisel Crucible Forge Quenchstone Sledge Fuller
            Swage Hardy Mandrel Punch Drift Rasp File Vise Guillotine Flatter
            Set-Hammer Cross-Peen Ball-Peen Straight-Peen Riveter Bick Stake Tuyere Ladle Clamp
            Grinder Wire-Brush Flux-Spoon Tempering-Bath Trip-Hammer Power-Hammer Press Rolling-Mill Upsetter Drawplate
            Heading-Tool Hot-Cutter Cold-Cutter
          )

          IFS=. read -r major minor patch <<< "$RELEASE_VERSION"
          version_key=$((major * 1000000 + minor * 1000 + patch))
          element_index=$((version_key % ${#elements[@]}))
          tool_index=$(((version_key / ${#elements[@]}) % ${#tools[@]}))
          codename="${elements[$element_index]} ${tools[$tool_index]}"

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$codename · $RELEASE_TAG"
