# Fedora/KDE Wayland + NVIDIA NVENC template. Rendered by bin/deploy.
# Secrets and client pairings live in sunshine_state.json and are not managed here.
sunshine_name = @SUNSHINE_HOST_NAME@
port = 47989
address_family = ipv4
upnp = disabled
origin_web_ui_allowed = lan

# KMS is deterministic and avoids a portal picker on every fresh session.
# Do not pin /dev/dri/cardN or a numeric output ID: neither is stable across
# reinstalls. Keep only the dummy plug connected when this headless host starts.
capture = kms
encoder = nvenc

# Let Sunshine/NVENC probe codec support instead of falsely advertising it.
hevc_mode = 0
av1_mode = 0
nvenc_preset = 1
nvenc_twopass = quarter_res
nvenc_spatial_aq = disabled
nvenc_vbv_increase = 0
nvenc_h264_cavlc = disabled

# Moonlight chooses the stream resolution and FPS; the dummy supplies the source.

# Wired LAN defaults: no UPnP/WAN exposure and moderate recovery overhead.
lan_encryption_mode = 0
wan_encryption_mode = 2
fec_percentage = 10
min_log_level = 2
